<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIE 测试控制台</title>
  <style>
    :root {
      --bg: #0f1419; --panel: #1a2029; --border: #2a323d; --fg: #d7dde5;
      --muted: #8a94a3; --accent: #4c9aff; --ok: #35c46a; --fail: #ff5c5c;
      --warn: #f5b544; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px; line-height: 1.5; }
    header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex;
      align-items: center; gap: 16px; flex-wrap: wrap; }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    header .sub { color: var(--muted); font-size: 12px; }
    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 24px; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; }
    .panel h2 { font-size: 13px; margin: 0 0 12px; text-transform: uppercase;
      letter-spacing: .05em; color: var(--muted); }
    label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
    input[type=text], textarea, select { width: 100%; background: #0d1117; color: var(--fg);
      border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-family: var(--mono);
      font-size: 12px; }
    textarea { min-height: 150px; resize: vertical; }
    button { background: var(--accent); color: #fff; border: none; border-radius: 6px;
      padding: 7px 14px; font-size: 13px; cursor: pointer; }
    button:hover { filter: brightness(1.1); }
    button.secondary { background: #2a323d; color: var(--fg); }
    button.small { padding: 4px 10px; font-size: 12px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mb8 { margin-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px;
      font-family: var(--mono); }
    .badge.pass { background: rgba(53,196,106,.15); color: var(--ok); }
    .badge.fail { background: rgba(255,92,92,.15); color: var(--fail); }
    .badge.pending { background: #2a323d; color: var(--muted); }
    .tid { font-family: var(--mono); font-weight: 600; }
    .note { color: var(--muted); font-size: 11px; margin-top: 2px; }
    pre { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 12px;
      font-family: var(--mono); font-size: 12px; overflow: auto; max-height: 480px; margin: 0;
      white-space: pre-wrap; word-break: break-word; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .dot.up { background: var(--ok); } .dot.down { background: var(--fail); }
    .full { grid-column: 1 / -1; }
    .hint { color: var(--warn); font-size: 12px; }
    code { font-family: var(--mono); background: #0d1117; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>FIE 测试控制台</h1>
    <span class="sub">Focus Ingestion Engine · 端到端手动测试</span>
    <div class="row" style="margin-left:auto">
      <label style="margin:0">服务地址</label>
      <input type="text" id="baseUrl" value="http://127.0.0.1:17879" style="width:220px" />
      <button class="secondary small" id="btnHealth">健康检查</button>
      <span id="healthState" class="sub"><span class="dot down"></span>未检查</span>
    </div>
  </header>

  <div class="layout">
    <!-- 测试用例 -->
    <section class="panel full">
      <h2>测试用例（决策树全路径）</h2>
      <div class="row mb8">
        <button id="btnRunAll">顺序执行全部</button>
        <button class="secondary" id="btnReset">重置结果</button>
        <span class="note">提示：用例预期基于干净数据库。重跑请先重置：<code>docker compose down -v &amp;&amp; docker compose up -d</code>。顺序：T1/T2 建 Focus，T3 幂等，T4 低置信，T5 skip，T6 脱敏。</span>
      </div>
      <table id="scenarioTable">
        <thead>
          <tr><th style="width:44px">用例</th><th>标题 / 说明</th><th style="width:150px">预期</th>
            <th style="width:150px">实际</th><th style="width:70px">结果</th><th style="width:150px">操作</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- 查询 -->
    <section class="panel">
      <h2>查询</h2>
      <div class="row">
        <button class="secondary" data-get="/v1/runs?limit=10">GET /v1/runs</button>
        <button class="secondary" data-get="/v1/focuses?limit=10">GET /v1/focuses</button>
        <button class="secondary" data-get="/v1/focuses?includeArchived=1&limit=10">/focuses（含归档）</button>
        <button class="secondary" data-get="/v1/trend?days=30">GET /v1/trend</button>
      </div>
      <div class="row mt12">
        <input type="text" id="runIdInput" placeholder="runId（发送用例后自动填入）" style="flex:1" />
        <button class="secondary" id="btnRunDetail">查看该 run 详情</button>
      </div>
      <p class="note mt8">T6 发送后点此查看，可核对返回 <code>event.summary</code> 已被脱敏为 <code>[REDACTED_*]</code>。</p>
    </section>

    <!-- 自定义请求 -->
    <section class="panel">
      <h2>自定义请求</h2>
      <label>目标端点</label>
      <select id="customEndpoint">
        <option value="/v1/events/ingest">POST /v1/events/ingest（单条）</option>
        <option value="/v1/events/batch">POST /v1/events/batch（批量）</option>
      </select>
      <label class="mt8">请求体（JSON）</label>
      <textarea id="customBody"></textarea>
      <div class="row mt8">
        <button id="btnSendCustom">发送</button>
        <button class="secondary" id="btnLoadBatch">载入批量示例</button>
        <button class="secondary" id="btnLoadIngest">载入单条示例</button>
      </div>
    </section>

    <!-- 响应 -->
    <section class="panel full">
      <h2>最近响应</h2>
      <pre id="output">（等待请求…）</pre>
    </section>
  </div>

  <script>
    // 测试用例内嵌于页面，确保通过 file:// 打开也可用（浏览器禁止 fetch 本地 json）。
    // 与 samples/test-scenarios.json 内容保持一致。
    const SCENARIOS = [
      { id: "T1", title: "新建 Focus（首个实质事件）", endpoint: "/v1/events/ingest",
        expect: { decision: "create_and_check_in" },
        note: "无候选 Focus，命中关键词且含文件变更，创建新 Focus。",
        event: { source: "codex", sourceEventId: "pay-codex-001", occurredAt: "2026-07-09T09:00:00+08:00",
          type: "conversation.finished", project: "支付网关重构",
          summary: "实现支付网关的路由分发骨架，重构原有单体下单逻辑。下一步：接入结算链路并补测试。",
          metadata: { files: ["src/payment/gateway.ts", "src/payment/router.ts"], threadId: "pay-thread-1" } } },
      { id: "T2", title: "跨工具高置信收敛（git-hook → 同一 Focus）", endpoint: "/v1/events/ingest",
        expect: { decision: "check_in", lowConfidence: false },
        note: "不同来源但项目名匹配 +50、共享 gateway.ts +25，高置信归入 T1 的 Focus。",
        event: { source: "git-hook", sourceEventId: "pay-commit-001", occurredAt: "2026-07-09T10:30:00+08:00",
          type: "git.commit.created", project: "支付网关重构",
          summary: "提交结算链路对接的第一版实现，覆盖网关到结算的调用。",
          metadata: { files: ["src/payment/gateway.ts", "src/payment/settlement.ts"], branch: "feature/payment-gateway" } } },
      { id: "T3", title: "幂等：重复 sourceEventId", endpoint: "/v1/events/ingest",
        expect: { status: "duplicate" },
        note: "与 T1 相同的 source+sourceEventId，返回 duplicate，不写新 check-in。",
        event: { source: "codex", sourceEventId: "pay-codex-001", occurredAt: "2026-07-09T09:00:00+08:00",
          type: "conversation.finished", project: "支付网关重构",
          summary: "实现支付网关的路由分发骨架，重构原有单体下单逻辑。下一步：接入结算链路并补测试。",
          metadata: { files: ["src/payment/gateway.ts", "src/payment/router.ts"], threadId: "pay-thread-1" } } },
      { id: "T4", title: "低置信匹配（无项目名，仅单条路径重合）", endpoint: "/v1/events/ingest",
        expect: { decision: "check_in", lowConfidence: true },
        note: "无 project/关键词，仅共享 gateway.ts +25 及近期活跃 +5 ≈ 30，落在 [25,50) 复核区间。",
        event: { source: "ci", sourceEventId: "pay-ci-001", occurredAt: "2026-07-09T11:00:00+08:00",
          type: "automation.completed",
          summary: "同步上游服务的一处调用调整，确认与结算链路兼容。",
          metadata: { files: ["src/payment/gateway.ts"], labels: ["pipeline"] } } },
      { id: "T5", title: "skip（无实质关注信号）", endpoint: "/v1/events/ingest",
        expect: { decision: "skip" },
        note: "无文件、非完成/提交类、不含实质关键词，判为 trivial。",
        event: { source: "codex", sourceEventId: "pay-chat-001", occurredAt: "2026-07-09T11:15:00+08:00",
          type: "conversation.message", summary: "今天和同事口头对齐了一下本周的日常安排。" } },
      { id: "T6", title: "脱敏验证（敏感信息进摘要）", endpoint: "/v1/events/ingest",
        expect: { decision: "check_in" },
        note: "摘要含邮箱/token/IP/手机号/家目录路径，发送后用『查看该 run 详情』核对已脱敏。",
        event: { source: "agent", sourceEventId: "pay-agent-001", occurredAt: "2026-07-09T14:00:00+08:00",
          type: "conversation.finished", project: "支付网关重构",
          summary: "实现登录令牌轮换。联系人 alice@example.com，临时密钥 sk-abcdef1234567890ABCD，部署机 10.0.0.5，联系电话 13800138000，配置路径 /Users/hanjun/secret/config.json。",
          metadata: { files: ["src/payment/auth.ts"] } } },
    ];

    const BATCH_EXAMPLE = { events: [
      { source: "ci", sourceEventId: "pay-batch-001", occurredAt: "2026-07-09T15:00:00+08:00",
        type: "automation.completed", project: "支付网关重构",
        summary: "批量事件示例：CI 完成一次针对结算链路的回归测试。",
        metadata: { files: ["tests/payment/settlement.test.ts"] } },
      { source: "git-hook", sourceEventId: "pay-batch-002", occurredAt: "2026-07-09T15:05:00+08:00",
        type: "git.commit.created", project: "支付网关重构",
        summary: "批量事件示例：修复结算金额精度问题。",
        metadata: { files: ["src/payment/settlement.ts"] } },
    ] };

    const $ = (sel) => document.querySelector(sel);
    const baseUrl = () => $("#baseUrl").value.replace(/\/+$/, "");
    const output = $("#output");
    const showOutput = (label, data) =>
      output.textContent = label + "\n" + (typeof data === "string" ? data : JSON.stringify(data, null, 2));

    async function api(method, path, body) {
      const opts = { method, headers: {} };
      if (body !== undefined) { opts.headers["content-type"] = "application/json"; opts.body = JSON.stringify(body); }
      const res = await fetch(baseUrl() + path, opts);
      let data; const text = await res.text();
      try { data = JSON.parse(text); } catch { data = text; }
      return { status: res.status, ok: res.ok, data };
    }

    function evaluate(expect, data) {
      for (const [k, v] of Object.entries(expect)) {
        if (data == null || data[k] !== v) return false;
      }
      return true;
    }
    function actualSummary(data) {
      if (data == null || typeof data !== "object") return String(data);
      const parts = [];
      if (data.status) parts.push("status=" + data.status);
      if (data.decision) parts.push(data.decision);
      if (data.lowConfidence === true) parts.push("lowConf");
      if (data.deduplicated === true) parts.push("dedup");
      if (data.error) parts.push("error");
      return parts.join(" ") || "—";
    }

    function renderTable() {
      const tbody = $("#scenarioTable tbody");
      tbody.innerHTML = "";
      SCENARIOS.forEach((s) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="tid">${s.id}</td>
          <td>${s.title}<div class="note">${s.note}</div></td>
          <td><code>${Object.entries(s.expect).map(([k,v])=>k+"="+v).join(" ")}</code></td>
          <td id="actual-${s.id}" class="note">—</td>
          <td><span class="badge pending" id="badge-${s.id}">待执行</span></td>
          <td><button class="small" data-send="${s.id}">发送</button></td>`;
        tbody.appendChild(tr);
      });
    }

    async function sendScenario(s) {
      const badge = $("#badge-" + s.id);
      badge.className = "badge pending"; badge.textContent = "执行中…";
      try {
        const { data } = await api("POST", s.endpoint, s.event);
        const pass = evaluate(s.expect, data);
        $("#actual-" + s.id).innerHTML = `<code>${actualSummary(data)}</code>`;
        badge.className = "badge " + (pass ? "pass" : "fail");
        badge.textContent = pass ? "通过" : "不符";
        if (data && data.runId) $("#runIdInput").value = data.runId;
        showOutput(`[${s.id}] POST ${s.endpoint} → ${pass ? "通过" : "不符预期"}`, data);
        return pass;
      } catch (err) {
        badge.className = "badge fail"; badge.textContent = "错误";
        $("#actual-" + s.id).innerHTML = `<code>请求失败</code>`;
        showOutput(`[${s.id}] 请求失败`, String(err) + "\n\n（若为跨源/连接错误：确认服务已启动，且已加载带 CORS 的镜像版本）");
        return false;
      }
    }

    // 事件绑定
    $("#btnHealth").addEventListener("click", async () => {
      try {
        const { data, ok } = await api("GET", "/health");
        $("#healthState").innerHTML = ok ? '<span class="dot up"></span>正常'
          : '<span class="dot down"></span>异常';
        showOutput("GET /health", data);
      } catch (err) {
        $("#healthState").innerHTML = '<span class="dot down"></span>连接失败';
        showOutput("GET /health 失败", String(err));
      }
    });

    document.querySelectorAll("[data-get]").forEach((btn) =>
      btn.addEventListener("click", async () => {
        const path = btn.getAttribute("data-get");
        const { data } = await api("GET", path);
        showOutput("GET " + path, data);
      }));

    $("#scenarioTable").addEventListener("click", (e) => {
      const id = e.target.getAttribute && e.target.getAttribute("data-send");
      if (id) sendScenario(SCENARIOS.find((s) => s.id === id));
    });

    $("#btnRunAll").addEventListener("click", async () => {
      for (const s of SCENARIOS) { await sendScenario(s); await new Promise((r) => setTimeout(r, 150)); }
      showOutput("顺序执行完成", "已按 T1→T6 顺序发送全部用例，见上方各行结果。");
    });

    $("#btnReset").addEventListener("click", () => { renderTable(); showOutput("已重置", "（结果已清空，服务端数据不受影响）"); });

    $("#btnRunDetail").addEventListener("click", async () => {
      const id = $("#runIdInput").value.trim();
      if (!id) return showOutput("提示", "请先填入 runId（或发送任一用例后自动填入）。");
      const { data } = await api("GET", "/v1/runs/" + encodeURIComponent(id));
      showOutput("GET /v1/runs/" + id, data);
    });

    $("#btnSendCustom").addEventListener("click", async () => {
      let body;
      try { body = JSON.parse($("#customBody").value); }
      catch (err) { return showOutput("JSON 解析失败", String(err)); }
      const path = $("#customEndpoint").value;
      const { data } = await api("POST", path, body);
      if (data && data.runId) $("#runIdInput").value = data.runId;
      showOutput("POST " + path, data);
    });

    $("#btnLoadBatch").addEventListener("click", () => {
      $("#customEndpoint").value = "/v1/events/batch";
      $("#customBody").value = JSON.stringify(BATCH_EXAMPLE, null, 2);
    });
    $("#btnLoadIngest").addEventListener("click", () => {
      $("#customEndpoint").value = "/v1/events/ingest";
      $("#customBody").value = JSON.stringify(SCENARIOS[0].event, null, 2);
    });

    // 初始化
    renderTable();
    $("#customBody").value = JSON.stringify(SCENARIOS[0].event, null, 2);
    $("#btnHealth").click();
  </script>
</body>
</html>
